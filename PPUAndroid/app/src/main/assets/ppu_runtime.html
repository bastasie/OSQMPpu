<!doctype html>
<html lang="en"><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PPU Runtime</title>
<style>
html,body{margin:0;height:100%;background:#02050a;color:#edf6ff;font-family:system-ui,sans-serif}body{display:flex;flex-direction:column;overflow:hidden}
header{padding:12px 14px;border-bottom:1px solid #1c3858;display:flex;justify-content:space-between}.title{font-weight:800;letter-spacing:.1em}.muted{color:#8ca9c6;font-size:12px}
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 300px;gap:10px;padding:10px}.stage{min-height:0;border:1px solid #1c3858;border-radius:16px;overflow:hidden;background:#050a12}.stage svg{width:100%;height:100%}
aside{overflow:auto;display:flex;flex-direction:column;gap:10px}.card{background:#0a1220;border:1px solid #1c3858;border-radius:14px;padding:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button,input{width:100%;box-sizing:border-box;background:#07101d;color:#edf6ff;border:1px solid #244565;border-radius:10px;padding:10px}button:active{transform:scale(.98)}.out{font:12px ui-monospace,monospace;color:#9fc2df;white-space:pre-wrap}
@media(max-width:780px){main{grid-template-columns:1fr}.stage{height:63vh}aside{max-height:35vh}}
</style></head>
<body>
<header><div class="title">PPU RUNTIME</div><div id="host" class="muted">initialising</div></header>
<main>
<div class="stage" id="stage">
<svg id="svg" viewBox="0 0 720 720" xmlns="http://www.w3.org/2000/svg">
<rect width="720" height="720" fill="#030914"/><defs><pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#10253a"/></pattern></defs>
<rect x="18" y="18" width="684" height="684" rx="24" fill="url(#g)" stroke="#2b4e71"/>
<g id="poles"><line x1="360" y1="70" x2="360" y2="650" stroke="#5b7995" stroke-width="3"/><circle cx="360" cy="92" r="14" fill="#73d8ff"/><circle cx="360" cy="628" r="14" fill="#ff8c8c"/><text x="360" y="54" text-anchor="middle" fill="#73d8ff" font-size="22">N</text><text x="360" y="680" text-anchor="middle" fill="#ff8c8c" font-size="22">S</text></g>
<g id="food"><circle r="9" fill="#ffd76a"/></g><g id="snake"></g><text id="score" x="42" y="52" font-size="23" fill="#edf6ff">0</text>
<text id="state" x="678" y="52" text-anchor="end" font-size="12" fill="#8ca9c6">RUN</text>
</svg></div>
<aside>
<div class="card"><b>Execution</b><div class="grid" style="margin-top:8px"><button onclick="selfTest()">PPU SELF TEST</button><button onclick="mc()">MONTE CARLO</button><button onclick="pk()">PRIME KERNEL</button><button onclick="openFile()">OPEN CARRIER</button></div><div id="out" class="out">ready</div></div>
<div class="card"><b>Frame clock</b><div class="grid" style="margin-top:8px"><label>FPS<input id="fps" value="60" type="number" min="1" max="240"></label><label>Pole °/s<input id="omega" value="120" type="number" min="-3000" max="3000"></label></div></div>
<div class="card"><b>Snake</b><div class="out">Swipe/touch or arrows. Trigger commands: ! up, @ right, # down, $ left, % pause, * turbo, ? reset.</div></div>
<div class="card"><b>Carrier</b><input id="file" type="file" accept=".jpg,.jpeg,.png"><div id="carrier" class="out">No external carrier inspected.</div></div>
</aside></main>
<script>
(function(){
var svg=document.getElementById("svg"),snakeG=document.getElementById("snake"),food=document.getElementById("food"),poles=document.getElementById("poles"),score=document.getElementById("score"),state=document.getElementById("state");
var S={n:24,cell:26.5,dir:{x:1,y:0},pending:{x:1,y:0},body:[{x:12,y:12},{x:11,y:12},{x:10,y:12}],food:{x:18,y:12},score:0,best:0,dead:false,pause:false,pole:0,last:0,acc:0,frame:0,seed:2463534242};
function rand(){S.seed^=S.seed<<13;S.seed^=S.seed>>>17;S.seed^=S.seed<<5;return (S.seed>>>0)/4294967296}
function dir(x,y){if(S.dir.x+x===0&&S.dir.y+y===0)return;S.pending={x:x,y:y}}
function spawn(){var q;do{q={x:(rand()*S.n)|0,y:(rand()*S.n)|0}}while(S.body.some(function(p){return p.x===q.x&&p.y===q.y}));S.food=q}
function draw(){
while(snakeG.firstChild)snakeG.removeChild(snakeG.firstChild);
S.body.forEach(function(p,i){var r=document.createElementNS("http://www.w3.org/2000/svg","rect");r.setAttribute("x",30+p.x*S.cell);r.setAttribute("y",54+p.y*S.cell);r.setAttribute("width",S.cell-2);r.setAttribute("height",S.cell-2);r.setAttribute("rx",7);r.setAttribute("fill",i===0?"#8dffbb":"#49a7d4");snakeG.appendChild(r)});
food.setAttribute("transform","translate("+(30+S.food.x*S.cell+S.cell/2)+","+(54+S.food.y*S.cell+S.cell/2)+")");
score.textContent="SCORE "+S.score+"  BEST "+S.best; state.textContent=S.dead?"GAME OVER":(S.pause?"PAUSED":"RUN");
poles.setAttribute("transform","rotate("+S.pole+" 360 360)");
}
function step(){
if(S.pause||S.dead)return;S.dir=S.pending;var h={x:S.body[0].x+S.dir.x,y:S.body[0].y+S.dir.y};
if(h.x<0||h.y<0||h.x>=S.n||h.y>=S.n||S.body.some(function(p,i){return i>0&&p.x===h.x&&p.y===h.y})){S.dead=true;return}
S.body.unshift(h);
if(h.x===S.food.x&&h.y===S.food.y){S.score++;S.best=Math.max(S.best,S.score);spawn()}else S.body.pop();draw()
}
function reset(){S.body=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];S.dir={x:1,y:0};S.pending={x:1,y:0};S.score=0;S.dead=false;S.pause=false;S.pole=0;spawn();draw()}
function frame(t){
if(!S.last)S.last=t;var dt=t-S.last;S.last=t;var fps=Math.max(1,Number(document.getElementById("fps").value)||60);var omega=Number(document.getElementById("omega").value)||0;var period=1000/fps;
S.acc+=dt;while(S.acc>=period){S.acc-=period;S.frame++;S.pole+=omega/fps}
if(!frame.next||t>=frame.next){step();frame.next=t+125}draw();requestAnimationFrame(frame)
}
function cmd(c){var m={"!":[0,-1],"@":[1,0],"#":[0,1],"$":[-1,0]}[c];if(c==="%"){S.pause=!S.pause}else if(c==="*"){document.getElementById("omega").value=(Number(document.getElementById("omega").value)||0)*1.5}else if(c==="?"){reset()}else if(m){dir(m[0],m[1])}}
window.addEventListener("keydown",function(e){var m={ArrowUp:[0,-1],ArrowRight:[1,0],ArrowDown:[0,1],ArrowLeft:[-1,0]};if(m[e.key])dir(m[e.key][0],m[e.key][1]);else if("!@#$%*?".indexOf(e.key)>=0)cmd(e.key)});
var down=null;svg.addEventListener("pointerdown",function(e){down={x:e.clientX,y:e.clientY};svg.setPointerCapture(e.pointerId)});svg.addEventListener("pointerup",function(e){if(!down)return;var dx=e.clientX-down.x,dy=e.clientY-down.y;down=null;if(Math.max(Math.abs(dx),Math.abs(dy))>20){if(Math.abs(dx)>Math.abs(dy))dir(Math.sign(dx),0);else dir(0,Math.sign(dy))}else{var r=svg.getBoundingClientRect();dir(e.clientX-r.left<r.width/2?-1:1,0)}});

window.selfTest=function(){document.getElementById("out").textContent=PPUNative.selfTest()};
window.mc=function(){var n=Number(prompt("Monte Carlo samples","10000000"))||1000000;document.getElementById("out").textContent=PPUNative.runMonteCarlo(n)};
window.pk=function(){var n=Number(prompt("Prime count","1000000"))||100000;var r=Number(prompt("Rounds","2"))||2;document.getElementById("out").textContent=PPUNative.runPrimeKernel(n,r)};
window.openFile=function(){document.getElementById("file").click()};
window.ppuIncoming=function(x){document.getElementById("carrier").textContent=String(x)};
document.getElementById("file").addEventListener("change",async function(e){var f=e.target.files[0];if(!f)return;var b=new Uint8Array(await f.arrayBuffer()),s="";for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);document.getElementById("carrier").textContent=PPUNative.inspectJpegBase64(btoa(s))});
document.getElementById("host").textContent=PPUNative.platform();
reset();requestAnimationFrame(frame);
})();
</script></body></html>
